let allData = RAW_DATA.map(d => ({
code: d.code,
name: d.name,
NPParentCompanyYOY: parseFloat(d.NPParentCompanyYOY),
TORGrowRate: parseFloat(d.TORGrowRate),
ClosePrice: parseFloat(d.ClosePrice),
ChangePCT: parseFloat(d.ChangePCT)
}));

let currentSort = 'NPParentCompanyYOY';
let currentDir = 'desc';

function renderStats() {
const n = allData.length;
const avgNP = allData.reduce((s,d)=>s+d.NPParentCompanyYOY,0)/n;
const avgTR = allData.reduce((s,d)=>s+d.TORGrowRate,0)/n;
const maxNP = Math.max(...allData.map(d=>d.NPParentCompanyYOY));
const maxTR = Math.max(...allData.map(d=>d.TORGrowRate));
const upCount = allData.filter(d=>d.ChangePCT>0).length;
const downCount = allData.filter(d=>d.ChangePCT<0).length;

document.getElementById('stats').innerHTML = `
<div class="stat-card"><div class="label">符合条件的股票</div><div class="value red">${n} 只</div></div>
<div class="stat-card"><div class="label">净利润增速均值</div><div class="value red">${avgNP.toFixed(1)}%</div></div>
<div class="stat-card"><div class="label">营收增速均值</div><div class="value red">${avgTR.toFixed(1)}%</div></div>
<div class="stat-card"><div class="label">净利润增速最高</div><div class="value red">${maxNP.toFixed(1)}%</div></div>
<div class="stat-card"><div class="label">营收增速最高</div><div class="value red">${maxTR.toFixed(1)}%</div></div>
<div class="stat-card"><div class="label">今日上涨/下跌</div><div class="value">${upCount}/${downCount}</div></div>
`;
}

function sortData(data, field, dir) {
return [...data].sort((a,b) => {
let va = field === 'name' || field === 'code' ? a[field] : a[field];
let vb = field === 'name' || field === 'code' ? b[field] : b[field];
if (typeof va === 'string') va = va.toLowerCase();
if (typeof vb === 'string') vb = vb.toLowerCase();
if (va < vb) return dir === 'asc' ? -1 : 1;
if (va > vb) return dir === 'asc' ? 1 : -1;
return 0;
});
}

function formatGrowth(v) {
if (v >= 1000) return '<span class="growth-high">' + v.toFixed(1) + '%</span>';
if (v >= 100) return '<span class="growth-mid">' + v.toFixed(1) + '%</span>';
return v.toFixed(2) + '%';
}

function formatPrice(v) {
if (v >= 1000) return v.toFixed(2);
if (v >= 100) return v.toFixed(2);
return v.toFixed(2);
}

function formatChange(v) {
if (v > 0) return '<span class="price-up">+' + v.toFixed(2) + '%</span>';
if (v < 0) return '<span class="price-down">' + v.toFixed(2) + '%</span>';
return '<span class="price-flat">0.00%</span>';
}

function renderTable(data) {
const tbody = document.getElementById('tableBody');
tbody.innerHTML = data.map(d => `
<tr>
<td class="code">${d.code}</td>
<td class="name">${d.name}</td>
<td class="num">${formatGrowth(d.NPParentCompanyYOY)}</td>
<td class="num">${formatGrowth(d.TORGrowRate)}</td>
<td class="num">${formatPrice(d.ClosePrice)}</td>
<td class="num">${formatChange(d.ChangePCT)}</td>
</tr>
`).join('');
document.getElementById('resultCount').textContent = `显示 ${data.length} 条结果`;
}

function filterTable() {
const q = document.getElementById('searchInput').value.toLowerCase();
let filtered = allData;
if (q) {
filtered = allData.filter(d =>
d.name.toLowerCase().includes(q) || d.code.toLowerCase().includes(q)
);
}
const sorted = sortData(filtered, currentSort, currentDir);
renderTable(sorted);
}

function sortBy(field) {
if (currentSort === field) {
currentDir = currentDir === 'asc' ? 'desc' : 'asc';
} else {
currentSort = field;
// Default directions
if (field === 'name' || field === 'code') currentDir = 'asc';
else currentDir = 'desc';
}
document.getElementById('sortBy').value = field;
document.getElementById('sortDir').value = currentDir;
filterTable();
}

function sortTable() {
currentSort = document.getElementById('sortBy').value;
currentDir = document.getElementById('sortDir').value;
filterTable();
}
